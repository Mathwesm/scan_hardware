services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scan_hardware
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner -d scan_hardware"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  scan_hardware:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in .env}
      - LOG_SERIALIZE=true
      - HOST=0.0.0.0
      - REQUIRE_CATALOG=true
      - IMPORT_ROHIT_PATH=/app/import/pc-parts-by-type.zip
      - IMPORT_WARCODER_PATH=/app/import/warcoder-pc-parts.zip
      - IMAGE_IMPORT_MANIFEST=/app/image-import/manifest.json
      - PRICE_IMPORT_MANIFEST=/app/price-import/manifest.json
      - REQUIRE_API_KEY
      - API_KEY
    command: ["python", "-m", "scan_hardware.bootstrap"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data/raw/kaggle:/app/import:ro
      - ./data/import/images:/app/image-import:ro
      - ./data/import/prices:/app/price-import:ro
      - scanner_logs:/app/logs
      - scanner_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

volumes:
  postgres_data:
  scanner_logs:
  scanner_data:
