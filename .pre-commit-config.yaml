# Runs the same gate as the CI, automatically, on every commit.
# Install once with: poetry run pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy-project
        name: mypy project
        entry: poetry run mypy src/
        language: system
        pass_filenames: false
      - id: pytest-project
        name: pytest project
        entry: poetry run pytest -q
        language: system
        pass_filenames: false
      - id: detect-secrets-project
        name: detect secrets project
        entry: poetry run detect-secrets-hook
        language: system
