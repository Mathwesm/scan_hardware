name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    # Pull requests run on Linux alone: fast feedback, minimal quota. Pushes to main
    # fan out to all three systems, because that is where portability bugs surface —
    # path separators, cp1252 vs UTF-8, CRLF, case-sensitive filenames. macOS minutes
    # bill at 10x on private repositories, which is exactly why this is not the
    # default on every commit.
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ github.ref == 'refs/heads/main'
          && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]')
          || fromJSON('["ubuntu-latest"]') }}

    runs-on: ${{ matrix.os }}

    # The Windows runner defaults to PowerShell, where these commands would need
    # different syntax. Pinning bash keeps one set of steps for all three systems.
    defaults:
      run:
        shell: bash

    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      # Mirrors the local gate exactly. A green machine and a red CI means the
      # configuration diverged, and that is a bug to fix rather than to work around.
      - name: Format check
        run: poetry run ruff format --check .

      - name: Lint
        run: poetry run ruff check .

      - name: Type check
        run: poetry run mypy src/

      - name: Tests
        run: poetry run pytest

      - name: Secret scan
        run: poetry run detect-secrets-hook --baseline .secrets.baseline $(git ls-files)

      - name: Build scanner container
        if: runner.os == 'Linux'
        run: docker build --tag scan-hardware-ci .

      - name: Start scanner container
        if: runner.os == 'Linux'
        run: |
          export POSTGRES_PASSWORD="${{ github.run_id }}"
          export DATABASE_URL="postgresql://scanner:${POSTGRES_PASSWORD}@postgres:5432/scan_hardware"
          docker compose config --quiet
          docker run --detach --rm --name scan-hardware-ci \
            -e HOST=0.0.0.0 -p 127.0.0.1:18080:8000 scan-hardware-ci
          trap 'docker stop scan-hardware-ci' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs scan-hardware-ci
          exit 1

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: scan_hardware_test
          POSTGRES_USER: scanner
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scanner -d scan_hardware_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: PostgreSQL migration and runtime
        run: |
          export TEST_DATABASE_URL="postgresql://scanner:${{ github.run_id }}@127.0.0.1:5432/scan_hardware_test"
          poetry run pytest -q tests/test_postgres.py
