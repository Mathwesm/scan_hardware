<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hardware Scanner · Teste</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #17212c; background: #f2f5f8; }
    body { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { margin-bottom: 8px; }
    p { line-height: 1.5; }
    form, article { background: #fff; padding: 20px; border-radius: 12px; margin: 18px 0; box-shadow: 0 2px 12px #17212c12; }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    input[type=file], input[type=text] { width: 100%; box-sizing: border-box; padding: 10px; margin-bottom: 12px; }
    button { border: 0; border-radius: 8px; background: #135c8c; color: #fff; padding: 12px 18px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .muted { color: #526170; }
    .warning { color: #8a4b00; }
    .error { color: #a42323; }
    .product-image { display: block; width: 100%; max-height: 420px; object-fit: contain; }
    .image-views { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .image-views button { padding: 8px 12px; }
    .image-views button[aria-pressed=true] { background: #173951; }
    dl { display: grid; grid-template-columns: minmax(120px, 1fr) 2fr; gap: 8px; }
    dt { font-weight: 600; }
    dd { margin: 0; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Teste do scanner</h1>
  <p>Fotografe de perto o código impresso na peça ou escolha uma imagem. O resultado só identifica o modelo quando o texto é legível.</p>
  <form id="photo-form">
    <label for="photo">Foto do código de uma peça de computador</label>
    <input id="photo" name="image" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" required>
    <button type="submit">Escanear foto</button>
  </form>
  <form id="text-form">
    <label for="code">Ou teste um código já lido</label>
    <input id="code" type="text" maxlength="500" placeholder="Ex.: E8400 ou A320M-DVS" required>
    <button type="submit">Pesquisar código</button>
  </form>
  <section id="results" aria-live="polite"></section>
  <script>
    const results = document.getElementById('results');
    let lookupText = null;
    const labels = { socket: 'Socket', cores: 'Núcleos', threads: 'Threads', base_clock_ghz: 'Clock base', boost_clock_ghz: 'Clock turbo', tdp_w: 'TDP', integrated_graphics: 'Vídeo integrado', smt: 'SMT', chipset: 'Chipset', vram_gb: 'Memória de vídeo', core_clock_mhz: 'Clock da GPU', boost_clock_mhz: 'Clock turbo da GPU', board_power_w: 'Consumo da placa', form_factor: 'Formato', max_memory_gb: 'Memória máxima', memory_slots: 'Slots de memória', memory_type: 'Tipo de memória', memory_slot_type: 'Tipo de slot', memory_channels: 'Canais de memória', memory_speed_mt_s: 'Velocidade da RAM', capacity_gb: 'Capacidade do kit', module_count: 'Módulos', module_capacity_gb: 'Capacidade por módulo', cas_latency: 'Latência CAS', memory_speed_mhz: 'Velocidade da VRAM', memory_bus_bits: 'Barramento da VRAM', shader_units: 'Unidades de processamento', l2_cache_mb: 'Cache L2', l3_cache_mb: 'Cache L3', max_memory_standard_mhz: 'RAM até (sem OC)', max_memory_oc_mhz: 'RAM até (com OC)', length_mm: 'Comprimento', resolution_class: 'Resolução', color: 'Cor', wattage_w: 'Potência', efficiency_rating: 'Certificação', modularity: 'Cabos', cooling_type: 'Tipo de refrigeração', storage_type: 'Tipo de armazenamento', storage_capacity_gb: 'Capacidade' };
    const units = { max_memory_gb: 'GB', capacity_gb: 'GB', module_capacity_gb: 'GB', storage_capacity_gb: 'GB', vram_gb: 'GB', base_clock_ghz: 'GHz', boost_clock_ghz: 'GHz', tdp_w: 'W', core_clock_mhz: 'MHz', boost_clock_mhz: 'MHz', board_power_w: 'W', wattage_w: 'W', length_mm: 'mm', max_memory_standard_mhz: 'MHz', max_memory_oc_mhz: 'MHz', memory_speed_mt_s: 'MT/s', memory_speed_mhz: 'MHz', memory_bus_bits: 'bits', l2_cache_mb: 'MB', l3_cache_mb: 'MB' };
    function line(parent, tag, value, className) {
      const node = document.createElement(tag);
      node.textContent = value;
      if (className) node.className = className;
      parent.appendChild(node);
      return node;
    }
    const viewLabels = { front: 'Frente', side: 'Lado', back: 'Verso', detail: 'Detalhe', other: 'Referência' };
    async function renderImages(card, match) {
      let images = [];
      try {
        const response = await fetch(`/items/${encodeURIComponent(match.id)}/images`);
        if (response.ok) images = await response.json();
      } catch (_) {
        // Keep the scan result visible when the optional gallery is unavailable.
      }
      if (!images.length && match.image_url) images = [{ url: match.image_url, view: 'other', source: 'external' }];
      if (!images.length) {
        line(card, 'p', 'Imagem de referência ainda não cadastrada.', 'muted');
        return;
      }
      const primary = images.find(image => image.is_primary) || images[0];
      const photo = document.createElement('img');
      photo.className = 'product-image';
      photo.loading = 'lazy';
      photo.onerror = () => { photo.remove(); line(card, 'p', 'Imagem de referência indisponível.', 'muted'); };
      card.appendChild(photo);
      const views = document.createElement('div');
      views.className = 'image-views';
      card.appendChild(views);
      function selectImage(image) {
        photo.src = image.url;
        photo.alt = `${viewLabels[image.view] || 'Imagem'} de ${match.model}`;
        for (const button of views.children) button.setAttribute('aria-pressed', String(button.dataset.url === image.url));
      }
      for (const image of images) {
        const button = document.createElement('button');
        button.type = 'button';
        button.dataset.url = image.url;
        button.textContent = viewLabels[image.view] || 'Imagem';
        button.addEventListener('click', () => selectImage(image));
        views.appendChild(button);
      }
      selectImage(primary);
      if (primary.source === 'external') line(card, 'p', 'Imagem externa de referência; enquadramento não revisado.', 'muted');
    }
    async function render(data, append = false) {
      if (!append) {
        results.replaceChildren();
        const title = data.status === 'matched' ? 'Modelo identificado' : data.status === 'suggestions' ? 'Possíveis modelos — confirme a revisão' : 'Nenhum modelo encontrado';
        line(results, 'h2', title);
        if (typeof data.total_matches === 'number') line(results, 'p', `${data.total_matches} modelo(s) relacionado(s), ordenados por semelhança.`, 'muted');
      }
      const previousCount = results.querySelectorAll('article').length;
      results.querySelector('#load-more')?.remove();
      for (const [index, match] of (data.matches || []).entries()) {
        const card = document.createElement('article');
        results.appendChild(card);
        const modelName = match.model.toLowerCase().startsWith(`${match.brand.toLowerCase()} `) ? match.model : `${match.brand} ${match.model}`;
        line(card, 'h3', `${previousCount + index + 1}. ${modelName}`);
        if (typeof match.match_score === 'number') line(card, 'p', `Pontuação da busca: ${Math.round(match.match_score * 100)}/100`, 'muted');
        if (data.status === 'suggestions') line(card, 'p', 'Confirme o modelo antes de usar.', 'warning');
        if (typeof match.estimated_price_brl === 'number') {
          const amount = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(match.estimated_price_brl);
          const count = match.price_offer_count || 1;
          line(card, 'p', `${count > 1 ? 'Média de preços' : 'Preço observado'}: ${amount}`);
          line(card, 'p', `${count} oferta${count > 1 ? 's' : ''} de produto novo, preço padrão sem frete. Conferido em ${new Date(match.price_observed_at).toLocaleDateString('pt-BR')}.`, 'muted');
        } else if (match.price_status === 'unavailable') {
          line(card, 'p', 'Preço indisponível: não há oferta recente de produto novo para este modelo exato.', 'muted');
        }
        if (typeof match.reference_price_amount === 'number') {
          const amount = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: match.reference_price_currency }).format(match.reference_price_amount);
          const label = match.reference_price_context === 'historical_review' ? `Preço histórico (${match.reference_price_date?.slice(0, 4) || 'data não informada'})` : 'Preço de referência do dataset (data da oferta não informada)';
          line(card, 'p', `${label}: ${amount}`);
          const source = line(card, 'p', 'Referência em moeda original; não representa preço atual no Brasil. Fonte: ', 'muted');
          const link = document.createElement('a');
          link.href = match.reference_price_source_url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = 'consultar';
          source.appendChild(link);
        }
        await renderImages(card, match);
        const specs = document.createElement('dl');
        card.appendChild(specs);
        for (const [key, value] of Object.entries(match)) {
          if (!(key in labels)) continue;
          const label = key === 'color' && match.color_source === 'photo_estimate' ? 'Cor estimada pela foto' : key === 'color' && match.color_source === 'reference_estimate' ? 'Cor estimada da referência' : labels[key] || key;
          line(specs, 'dt', label);
          const formatted = typeof value === 'boolean' ? (value ? 'Sim' : 'Não') : `${value}${units[key] ? ` ${units[key]}` : ''}`;
          line(specs, 'dd', formatted);
        }
      }
      const shown = previousCount + (data.matches || []).length;
      if (lookupText && typeof data.total_matches === 'number' && shown < data.total_matches) {
        const more = document.createElement('button');
        more.id = 'load-more';
        more.type = 'button';
        more.textContent = `Carregar mais (${shown} de ${data.total_matches})`;
        more.addEventListener('click', async () => {
          more.disabled = true;
          try {
            const response = await fetch('/lookup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: lookupText, offset: shown }) });
            const page = await response.json();
            if (!response.ok) throw new Error(page.detail || `HTTP ${response.status}`);
            await render(page, true);
          } catch (error) {
            more.disabled = false;
            line(results, 'p', `Falha ao carregar mais: ${error.message}`, 'error');
          }
        });
        results.appendChild(more);
      }
    }
    async function submit(form, url, body) {
      const button = form.querySelector('button');
      button.disabled = true;
      results.replaceChildren();
      line(results, 'p', 'Processando…');
      try {
        const response = await fetch(url, body);
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || `HTTP ${response.status}`);
        await render(data);
      } catch (error) {
        results.replaceChildren();
        line(results, 'p', `Falha: ${error.message}`, 'error');
      } finally {
        button.disabled = false;
      }
    }
    document.getElementById('photo-form').addEventListener('submit', event => {
      event.preventDefault();
      lookupText = null;
      submit(event.currentTarget, '/scan', { method: 'POST', body: new FormData(event.currentTarget) });
    });
    document.getElementById('text-form').addEventListener('submit', event => {
      event.preventDefault();
      lookupText = document.getElementById('code').value;
      submit(event.currentTarget, '/lookup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: lookupText }) });
    });
  </script>
</body>
</html>
