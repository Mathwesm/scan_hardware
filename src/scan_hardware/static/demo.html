<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hardware Scanner · Catálogo</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; color: #152b38; background: #f3f7f7; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top right, #d9f1ed, transparent 34rem), #f3f7f7; }
    .shell { width: min(100%, 1040px); margin: 0 auto; padding: 32px 20px 80px; }
    .hero { padding: 32px 36px; border-radius: 24px; background: linear-gradient(120deg, #102e3b, #164d56); color: white; box-shadow: 0 20px 50px #143c4930; }
    .eyebrow { margin: 0 0 10px; color: #9ce4d9; font-size: .78rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 3rem); line-height: 1.1; letter-spacing: -.04em; }
    .hero p:last-child { max-width: 650px; margin: 14px 0 0; color: #d8e9e9; }
    p { line-height: 1.55; }
    .search-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 22px; }
    form, article { background: white; border: 1px solid #dce8e8; border-radius: 20px; box-shadow: 0 12px 32px #1b404014; }
    form { padding: 24px; }
    label { display: block; font-weight: 750; margin-bottom: 12px; }
    input[type=file], input[type=text] { width: 100%; min-height: 48px; margin-bottom: 16px; padding: 11px 13px; border: 1px solid #cbdcdd; border-radius: 10px; background: #f9fbfb; color: #152b38; font: inherit; }
    input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid #48bcb1; outline-offset: 2px; }
    button { border: 0; border-radius: 10px; background: #087f78; color: white; padding: 12px 17px; font: inherit; font-weight: 750; cursor: pointer; }
    button:hover:not(:disabled) { background: #086a66; }
    button:disabled { opacity: .65; cursor: wait; }
    a { color: #076d71; }
    .muted { color: #60757b; }
    .warning { color: #9b6200; }
    .error { color: #b12e2e; }
    #results { margin-top: 32px; }
    #results > h2 { margin: 0 0 8px; font-size: 1.55rem; }
    #results > article { padding: clamp(20px, 4vw, 36px); margin-top: 18px; }
    article h3 { margin: 0 0 18px; font-size: clamp(1.4rem, 3vw, 2rem); line-height: 1.2; letter-spacing: -.025em; }
    article h4 { margin: 34px 0 8px; font-size: 1.25rem; }
    .product-image { display: block; width: 100%; height: min(48vw, 420px); min-height: 240px; padding: 22px; border: 1px solid #e3eded; border-radius: 16px; background: #f7fafa; object-fit: contain; }
    .image-placeholder { display: grid; min-height: 150px; margin: 18px 0; padding: 24px; place-content: center; gap: 6px; border: 1px dashed #b9d4d1; border-radius: 16px; background: #f7fbfa; text-align: center; }
    .image-placeholder strong { color: #315e62; }
    .image-views { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .image-views button { padding: 7px 12px; background: #edf6f5; color: #16535a; font-size: .87rem; }
    .image-views button[aria-pressed=true] { background: #16535a; color: white; }
    dl { display: grid; grid-template-columns: minmax(145px, .7fr) 1.3fr; gap: 0 22px; margin: 24px 0; border-top: 1px solid #e5eeee; }
    dt, dd { padding: 11px 0; border-bottom: 1px solid #e5eeee; }
    dt { color: #526d74; font-weight: 650; }
    dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
    .related-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; padding: 0; list-style: none; }
    .related-item { min-width: 0; border: 1px solid #dce8e8; border-radius: 14px; background: #fbfdfd; overflow: hidden; }
    .related-item a { display: flex; align-items: center; gap: 12px; min-height: 98px; padding: 13px; color: inherit; text-decoration: none; }
    .related-item a:hover { background: #eef9f6; }
    .related-thumb { display: grid; flex: 0 0 66px; width: 66px; height: 66px; place-items: center; border-radius: 10px; background: #e7f2f0; color: #26666a; font-size: .75rem; font-weight: 800; object-fit: contain; }
    .related-name { display: block; font-size: .91rem; line-height: 1.3; font-weight: 750; overflow-wrap: anywhere; }
    .related-action { display: block; margin-top: 5px; color: #087f78; font-size: .8rem; font-weight: 700; }
    .back-link { display: inline-block; margin: 0 0 18px; color: #0c5559; font-weight: 750; text-decoration: none; }
    .back-link[hidden] { display: none; }
    .detail-page .search-grid { display: none; }
    .related-more { margin-top: 8px; }
    @media (max-width: 650px) { .shell { padding: 16px 12px 48px; } .hero { padding: 26px 22px; } .search-grid { grid-template-columns: 1fr; gap: 12px; } .product-image { height: 300px; } dl { grid-template-columns: minmax(120px, .9fr) 1.1fr; gap: 0 12px; } }
  </style>
</head>
<body>
  <main class="shell">
  <a class="back-link" id="back-link" href="/demo" hidden>← Voltar ao scanner</a>
  <header class="hero">
    <p class="eyebrow">Catálogo de hardware</p>
    <h1 id="page-title">Encontre sua peça</h1>
    <p id="page-description">Fotografe o código impresso no hardware ou pesquise o modelo para ver imagens, especificações e peças relacionadas.</p>
  </header>
  <div class="search-grid">
  <form id="photo-form">
    <label for="photo">Foto do código de uma peça de computador</label>
    <input id="photo" name="image" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" required>
    <button type="submit">Escanear foto</button>
  </form>
  <form id="text-form">
    <label for="code">Ou teste um código já lido</label>
    <input id="code" type="text" maxlength="500" placeholder="Ex.: E8400 ou A320M-DVS" required>
    <button type="submit">Pesquisar código</button>
  </form>
  </div>
  <section id="results" aria-live="polite"></section>
  </main>
  <script>
    const results = document.getElementById('results');
    let lookupText = null;
    const labels = { socket: 'Socket', cores: 'Núcleos', threads: 'Threads', base_clock_ghz: 'Clock base', boost_clock_ghz: 'Clock turbo', tdp_w: 'TDP', integrated_graphics: 'Vídeo integrado', smt: 'SMT', chipset: 'Chipset', vram_gb: 'Memória de vídeo', core_clock_mhz: 'Clock da GPU', boost_clock_mhz: 'Clock turbo da GPU', board_power_w: 'Consumo da placa', form_factor: 'Formato', max_memory_gb: 'Memória máxima', memory_slots: 'Slots de memória', memory_type: 'Tipo de memória', memory_slot_type: 'Tipo de slot', memory_channels: 'Canais de memória', memory_speed_mt_s: 'Velocidade da RAM', capacity_gb: 'Capacidade do kit', module_count: 'Módulos', module_capacity_gb: 'Capacidade por módulo', cas_latency: 'Latência CAS', memory_speed_mhz: 'Velocidade da VRAM', memory_bus_bits: 'Barramento da VRAM', shader_units: 'Unidades de processamento', l2_cache_mb: 'Cache L2', l3_cache_mb: 'Cache L3', max_memory_standard_mhz: 'RAM até (sem OC)', max_memory_oc_mhz: 'RAM até (com OC)', length_mm: 'Comprimento', resolution_class: 'Resolução', color: 'Cor', wattage_w: 'Potência', efficiency_rating: 'Certificação', modularity: 'Cabos', cooling_type: 'Tipo de refrigeração', storage_type: 'Tipo de armazenamento', storage_capacity_gb: 'Capacidade' };
    const units = { max_memory_gb: 'GB', capacity_gb: 'GB', module_capacity_gb: 'GB', storage_capacity_gb: 'GB', vram_gb: 'GB', base_clock_ghz: 'GHz', boost_clock_ghz: 'GHz', tdp_w: 'W', core_clock_mhz: 'MHz', boost_clock_mhz: 'MHz', board_power_w: 'W', wattage_w: 'W', length_mm: 'mm', max_memory_standard_mhz: 'MHz', max_memory_oc_mhz: 'MHz', memory_speed_mt_s: 'MT/s', memory_speed_mhz: 'MHz', memory_bus_bits: 'bits', l2_cache_mb: 'MB', l3_cache_mb: 'MB' };
    function line(parent, tag, value, className) {
      const node = document.createElement(tag);
      node.textContent = value;
      if (className) node.className = className;
      parent.appendChild(node);
      return node;
    }
    const viewLabels = { front: 'Frente', side: 'Lado', back: 'Verso', detail: 'Detalhe', other: 'Referência' };
    function showMissingImage(card) {
      const placeholder = document.createElement('div');
      placeholder.className = 'image-placeholder';
      line(placeholder, 'strong', 'Sem foto de referência');
      line(placeholder, 'span', 'Imagem deste modelo ainda não cadastrada ou indisponível.', 'muted');
      card.appendChild(placeholder);
    }
    async function renderImages(card, match) {
      let images = [];
      try {
        const response = await fetch(`/items/${encodeURIComponent(match.id)}/images`);
        if (response.ok) images = await response.json();
      } catch (_) {
        // Keep the scan result visible when the optional gallery is unavailable.
      }
      if (!images.length && match.image_url) images = [{ url: match.image_url, view: 'other', source: 'external' }];
      if (!images.length) {
        showMissingImage(card);
        return;
      }
      const primary = images.find(image => image.is_primary) || images[0];
      const photo = document.createElement('img');
      photo.className = 'product-image';
      photo.loading = 'lazy';
      photo.onerror = () => { photo.remove(); views.remove(); showMissingImage(card); };
      card.appendChild(photo);
      const views = document.createElement('div');
      views.className = 'image-views';
      card.appendChild(views);
      function selectImage(image) {
        photo.src = image.url;
        photo.alt = `${viewLabels[image.view] || 'Imagem'} de ${match.model}`;
        for (const button of views.children) button.setAttribute('aria-pressed', String(button.dataset.url === image.url));
      }
      for (const image of images) {
        const button = document.createElement('button');
        button.type = 'button';
        button.dataset.url = image.url;
        button.textContent = viewLabels[image.view] || 'Imagem';
        button.addEventListener('click', () => selectImage(image));
        views.appendChild(button);
      }
      selectImage(primary);
      if (primary.source === 'external') line(card, 'p', 'Imagem externa de referência; enquadramento não revisado.', 'muted');
    }
    function renderSocketRelated(card, match, showAutomatically) {
      if (!['cpu', 'motherboard'].includes(match.category) || !match.socket) return;
      const target = match.category === 'motherboard' ? 'processadores' : 'placas-mãe';
      line(card, 'h4', `${target === 'processadores' ? 'Processadores' : 'Placas-mãe'} com o mesmo socket`);
      const container = document.createElement('div');
      card.appendChild(container);
      const button = line(card, 'button', `Ver ${target} com o mesmo socket`, 'related-more');
      button.type = 'button';
      let offset = 0;
      button.addEventListener('click', async () => {
        button.disabled = true;
        button.textContent = 'Carregando…';
        try {
          const response = await fetch(`/specs/${encodeURIComponent(match.id)}/socket-related?limit=8&offset=${offset}`);
          const page = await response.json();
          if (!response.ok) throw new Error(page.detail || `HTTP ${response.status}`);
          if (offset === 0) {
            line(container, 'p', `${page.total} ${target} com socket ${page.socket}. Confirme chipset, geração e BIOS no site do fabricante antes de instalar.`, 'muted');
          }
          const list = container.querySelector('ul') || document.createElement('ul');
          list.className = 'related-grid';
          if (!list.parentNode) container.appendChild(list);
          for (const candidate of page.matches) {
            const entry = document.createElement('li');
            entry.className = 'related-item';
            const link = document.createElement('a');
            link.href = `/demo?item=${encodeURIComponent(candidate.id)}`;
            const thumb = candidate.image_url ? document.createElement('img') : document.createElement('span');
            thumb.className = 'related-thumb';
            if (candidate.image_url) {
              thumb.src = candidate.image_url;
              thumb.alt = '';
              thumb.loading = 'lazy';
              thumb.onerror = () => {
                const fallback = document.createElement('span');
                fallback.className = 'related-thumb';
                fallback.textContent = candidate.category === 'cpu' ? 'CPU' : 'MB';
                thumb.replaceWith(fallback);
              };
            } else {
              thumb.textContent = candidate.category === 'cpu' ? 'CPU' : 'MB';
            }
            link.appendChild(thumb);
            const description = document.createElement('span');
            line(description, 'span', candidate.model, 'related-name');
            line(description, 'span', 'Ver detalhes →', 'related-action');
            link.appendChild(description);
            entry.appendChild(link);
            list.appendChild(entry);
          }
          offset += page.matches.length;
          if (offset < page.total) {
            button.textContent = `Carregar mais ${target} (${offset} de ${page.total})`;
            button.disabled = false;
          } else {
            button.remove();
          }
        } catch (error) {
          line(container, 'p', `Falha ao buscar peças pelo socket: ${error.message}`, 'error');
          button.textContent = `Tentar buscar ${target} novamente`;
          button.disabled = false;
        }
      });
      if (showAutomatically) button.click();
    }
    async function render(data, append = false) {
      if (!append) {
        results.replaceChildren();
        const title = data.status === 'matched' ? 'Modelo identificado' : data.status === 'suggestions' ? 'Possíveis modelos — confirme a revisão' : 'Nenhum modelo encontrado';
        line(results, 'h2', title);
        if (typeof data.total_matches === 'number') line(results, 'p', `${data.total_matches} modelo(s) relacionado(s), ordenados por semelhança.`, 'muted');
      }
      const previousCount = results.querySelectorAll('article').length;
      results.querySelector('#load-more')?.remove();
      for (const [index, match] of (data.matches || []).entries()) {
        const card = document.createElement('article');
        results.appendChild(card);
        const modelName = match.model.toLowerCase().startsWith(`${match.brand.toLowerCase()} `) ? match.model : `${match.brand} ${match.model}`;
        if (!document.body.classList.contains('detail-page')) line(card, 'h3', `${previousCount + index + 1}. ${modelName}`);
        if (typeof match.match_score === 'number') line(card, 'p', `Pontuação da busca: ${Math.round(match.match_score * 100)}/100`, 'muted');
        if (data.status === 'suggestions') line(card, 'p', 'Confirme o modelo antes de usar.', 'warning');
        if (typeof match.estimated_price_brl === 'number') {
          const amount = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(match.estimated_price_brl);
          const count = match.price_offer_count || 1;
          line(card, 'p', `${count > 1 ? 'Média de preços' : 'Preço observado'}: ${amount}`);
          line(card, 'p', `${count} oferta${count > 1 ? 's' : ''} de produto novo, preço padrão sem frete. Conferido em ${new Date(match.price_observed_at).toLocaleDateString('pt-BR')}.`, 'muted');
        } else if (match.price_status === 'unavailable') {
          line(card, 'p', 'Preço indisponível: não há oferta recente de produto novo para este modelo exato.', 'muted');
        }
        if (typeof match.reference_price_amount === 'number') {
          const amount = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: match.reference_price_currency }).format(match.reference_price_amount);
          const label = match.reference_price_context === 'historical_review' ? `Preço histórico (${match.reference_price_date?.slice(0, 4) || 'data não informada'})` : 'Preço de referência do dataset (data da oferta não informada)';
          line(card, 'p', `${label}: ${amount}`);
          const source = line(card, 'p', 'Referência em moeda original; não representa preço atual no Brasil. Fonte: ', 'muted');
          const link = document.createElement('a');
          link.href = match.reference_price_source_url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = 'consultar';
          source.appendChild(link);
        }
        await renderImages(card, match);
        const specs = document.createElement('dl');
        card.appendChild(specs);
        for (const [key, value] of Object.entries(match)) {
          if (!(key in labels)) continue;
          const label = key === 'color' && match.color_source === 'photo_estimate' ? 'Cor estimada pela foto' : key === 'color' && match.color_source === 'reference_estimate' ? 'Cor estimada da referência' : labels[key] || key;
          line(specs, 'dt', label);
          const formatted = typeof value === 'boolean' ? (value ? 'Sim' : 'Não') : `${value}${units[key] ? ` ${units[key]}` : ''}`;
          line(specs, 'dd', formatted);
        }
        renderSocketRelated(card, match, data.status === 'matched');
      }
      const shown = previousCount + (data.matches || []).length;
      if (lookupText && typeof data.total_matches === 'number' && shown < data.total_matches) {
        const more = document.createElement('button');
        more.id = 'load-more';
        more.type = 'button';
        more.textContent = `Carregar mais (${shown} de ${data.total_matches})`;
        more.addEventListener('click', async () => {
          more.disabled = true;
          try {
            const response = await fetch('/lookup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: lookupText, offset: shown }) });
            const page = await response.json();
            if (!response.ok) throw new Error(page.detail || `HTTP ${response.status}`);
            await render(page, true);
          } catch (error) {
            more.disabled = false;
            line(results, 'p', `Falha ao carregar mais: ${error.message}`, 'error');
          }
        });
        results.appendChild(more);
      }
    }
    async function submit(form, url, body) {
      const button = form.querySelector('button');
      button.disabled = true;
      results.replaceChildren();
      line(results, 'p', 'Processando…');
      try {
        const response = await fetch(url, body);
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || `HTTP ${response.status}`);
        await render(data);
      } catch (error) {
        results.replaceChildren();
        line(results, 'p', `Falha: ${error.message}`, 'error');
      } finally {
        button.disabled = false;
      }
    }
    document.getElementById('photo-form').addEventListener('submit', event => {
      event.preventDefault();
      lookupText = null;
      submit(event.currentTarget, '/scan', { method: 'POST', body: new FormData(event.currentTarget) });
    });
    document.getElementById('text-form').addEventListener('submit', event => {
      event.preventDefault();
      lookupText = document.getElementById('code').value;
      submit(event.currentTarget, '/lookup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: lookupText }) });
    });
    async function showItemDetail(itemId) {
      document.body.classList.add('detail-page');
      document.getElementById('back-link').hidden = false;
      document.getElementById('page-title').textContent = 'Detalhes da peça';
      document.getElementById('page-description').textContent = 'Especificações cadastradas e outras peças que compartilham o socket.';
      line(results, 'p', 'Carregando informações da peça…', 'muted');
      try {
        const response = await fetch(`/specs/${encodeURIComponent(itemId)}`);
        const item = await response.json();
        if (!response.ok) throw new Error(item.detail || `HTTP ${response.status}`);
        const details = { ...item, image_url: item.local_image_url || item.image_url };
        for (const [key, spec] of Object.entries(item.specs || {})) {
          if (spec.status !== 'conflict' && spec.value !== null) details[key] = spec.value;
        }
        document.getElementById('page-title').textContent = item.model;
        await render({ status: 'matched', matches: [details] });
        results.querySelector('h2').textContent = item.category === 'cpu' ? 'Processador' : item.category === 'motherboard' ? 'Placa-mãe' : 'Peça de hardware';
        document.title = `${item.model} · Hardware Scanner`;
      } catch (error) {
        results.replaceChildren();
        line(results, 'p', `Não foi possível abrir a peça: ${error.message}`, 'error');
      }
    }
    const itemId = new URLSearchParams(window.location.search).get('item');
    if (itemId) showItemDetail(itemId);
  </script>
</body>
</html>
