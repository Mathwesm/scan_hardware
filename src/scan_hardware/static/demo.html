<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hardware Scanner · Teste</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #17212c; background: #f2f5f8; }
    body { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { margin-bottom: 8px; }
    p { line-height: 1.5; }
    form, article { background: #fff; padding: 20px; border-radius: 12px; margin: 18px 0; box-shadow: 0 2px 12px #17212c12; }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    input[type=file], input[type=text] { width: 100%; box-sizing: border-box; padding: 10px; margin-bottom: 12px; }
    button { border: 0; border-radius: 8px; background: #135c8c; color: #fff; padding: 12px 18px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .muted { color: #526170; }
    .warning { color: #8a4b00; }
    .error { color: #a42323; }
    img { max-width: 100%; max-height: 260px; object-fit: contain; }
    dl { display: grid; grid-template-columns: minmax(120px, 1fr) 2fr; gap: 8px; }
    dt { font-weight: 600; }
    dd { margin: 0; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Teste do scanner</h1>
  <p>Fotografe de perto o código impresso na peça ou escolha uma imagem. O resultado só identifica o modelo quando o texto é legível.</p>
  <form id="photo-form">
    <label for="photo">Foto do processador, placa de vídeo ou placa-mãe</label>
    <input id="photo" name="image" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" required>
    <button type="submit">Escanear foto</button>
  </form>
  <form id="text-form">
    <label for="code">Ou teste um código já lido</label>
    <input id="code" type="text" maxlength="500" placeholder="Ex.: E8400 ou A320M-DVS" required>
    <button type="submit">Pesquisar código</button>
  </form>
  <section id="results" aria-live="polite"></section>
  <script>
    const results = document.getElementById('results');
    const labels = { socket: 'Socket', cores: 'Núcleos', threads: 'Threads', base_clock_ghz: 'Clock base', boost_clock_ghz: 'Clock turbo', tdp_w: 'TDP', integrated_graphics: 'Vídeo integrado', smt: 'SMT', chipset: 'Chipset', vram_gb: 'Memória de vídeo', core_clock_mhz: 'Clock da GPU', boost_clock_mhz: 'Clock turbo da GPU', board_power_w: 'Consumo da placa', form_factor: 'Formato', max_memory_gb: 'Memória máxima', memory_slots: 'Slots de memória', memory_type: 'Tipo de memória', memory_slot_type: 'Tipo de slot', memory_channels: 'Canais de memória', memory_speed_mt_s: 'Memória suportada até', memory_speed_mhz: 'Velocidade da VRAM', memory_bus_bits: 'Barramento da VRAM', shader_units: 'Unidades de processamento', l2_cache_mb: 'Cache L2', l3_cache_mb: 'Cache L3', max_memory_standard_mhz: 'RAM até (sem OC)', max_memory_oc_mhz: 'RAM até (com OC)', length_mm: 'Comprimento', resolution_class: 'Resolução', color: 'Cor' };
    const units = { max_memory_gb: 'GB', vram_gb: 'GB', base_clock_ghz: 'GHz', boost_clock_ghz: 'GHz', tdp_w: 'W', core_clock_mhz: 'MHz', boost_clock_mhz: 'MHz', board_power_w: 'W', length_mm: 'mm', max_memory_standard_mhz: 'MHz', max_memory_oc_mhz: 'MHz', memory_speed_mt_s: 'MT/s', memory_speed_mhz: 'MHz', memory_bus_bits: 'bits', l2_cache_mb: 'MB', l3_cache_mb: 'MB' };
    function line(parent, tag, value, className) {
      const node = document.createElement(tag);
      node.textContent = value;
      if (className) node.className = className;
      parent.appendChild(node);
      return node;
    }
    function render(data) {
      results.replaceChildren();
      const title = data.status === 'matched' ? 'Modelo identificado' : data.status === 'suggestions' ? 'Possíveis modelos — confirme a revisão' : 'Nenhum modelo encontrado';
      line(results, 'h2', title);
      for (const match of data.matches || []) {
        const card = document.createElement('article');
        results.appendChild(card);
        const modelName = match.model.toLowerCase().startsWith(`${match.brand.toLowerCase()} `) ? match.model : `${match.brand} ${match.model}`;
        line(card, 'h3', modelName);
        if (data.status === 'suggestions') line(card, 'p', 'Confirme o modelo antes de usar.', 'warning');
        const imageUrl = match.image_url;
        if (imageUrl) {
          const img = document.createElement('img');
          img.src = imageUrl;
          img.alt = `Imagem de referência para ${match.model}`;
          img.loading = 'lazy';
          img.onerror = () => { img.remove(); line(card, 'p', 'Imagem de referência indisponível.', 'muted'); };
          card.appendChild(img);
        } else {
          line(card, 'p', 'Imagem de referência ainda não cadastrada.', 'muted');
        }
        const specs = document.createElement('dl');
        card.appendChild(specs);
        for (const [key, value] of Object.entries(match)) {
          if (!(key in labels)) continue;
          line(specs, 'dt', labels[key] || key);
          const formatted = typeof value === 'boolean' ? (value ? 'Sim' : 'Não') : `${value}${units[key] ? ` ${units[key]}` : ''}`;
          line(specs, 'dd', formatted);
        }
      }
    }
    async function submit(form, url, body) {
      const button = form.querySelector('button');
      button.disabled = true;
      results.replaceChildren();
      line(results, 'p', 'Processando…');
      try {
        const response = await fetch(url, body);
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || `HTTP ${response.status}`);
        render(data);
      } catch (error) {
        results.replaceChildren();
        line(results, 'p', `Falha: ${error.message}`, 'error');
      } finally {
        button.disabled = false;
      }
    }
    document.getElementById('photo-form').addEventListener('submit', event => {
      event.preventDefault();
      submit(event.currentTarget, '/scan', { method: 'POST', body: new FormData(event.currentTarget) });
    });
    document.getElementById('text-form').addEventListener('submit', event => {
      event.preventDefault();
      submit(event.currentTarget, '/lookup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: document.getElementById('code').value }) });
    });
  </script>
</body>
</html>
